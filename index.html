<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Waste Management | Assignment Repository</title>
  <meta name="description" content="E-Waste Management assignment repository: 11 assignments with PDFs, images, presentations, documents and links." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== DASHBOARD (LIST) VIEW ===================== -->
  <div id="listView">
    <header class="hero">
      <div class="hero-inner">
        <div class="leaf-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <p class="eyebrow">Assignment Repository</p>
        <h1>E-Waste Management</h1>
        <p class="subtitle">Assignment Repository</p>

        <!-- Student information -->
        <section class="student-info" aria-label="Student information">
          <div class="student-item">
            <span class="student-label">Name</span>
            <span class="student-value">Siddhi Sachin Kharangate</span>
          </div>
          <div class="student-item">
            <span class="student-label">Roll Number</span>
            <span class="student-value">25102A2001</span>
          </div>
          <div class="student-item">
            <span class="student-label">Department</span>
            <span class="student-value">Computer Engineering</span>
          </div>
        </section>

        <div class="counter" id="counter" aria-live="polite">11 Assignments</div>

        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="searchInput" placeholder="Search assignments..." aria-label="Search assignments" autocomplete="off" />
        </div>
      </div>
    </header>

    <main class="container">
      <div id="grid" class="grid"></div>
      <div id="noResults" class="empty-state" hidden>
        <h3>No assignments found</h3>
        <p>Try a different keyword, for example "tracker" or "LEED".</p>
      </div>
    </main>
  </div>

  <!-- ===================== DETAILS VIEW ===================== -->
  <div id="detailView" hidden>
    <div class="detail-bar">
      <button class="back-btn" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to Assignments
      </button>
    </div>
    <main class="container detail-container">
      <section class="detail-head">
        <span class="detail-number" id="detailNumber"></span>
        <h2 id="detailTitle"></h2>
        <p id="detailDesc"></p>
        <span class="res-count" id="detailCount"></span>
      </section>
      <section id="resources" class="resources"></section>
    </main>
  </div>

  <!-- ===================== IMAGE LIGHTBOX ===================== -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image">&times;</button>
    <img id="lightboxImg" alt="" />
    <p id="lightboxCaption"></p>
  </div>

  <footer class="footer">E-Waste Management &middot; Assignment Repository</footer>

  <script src="script.js"></script>
</body>
</html>
